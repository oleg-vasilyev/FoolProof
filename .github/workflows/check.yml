# The push gate: lint, types and documents only. main is released by tag, so a
# red test on main is tolerable — but the website ships straight out of docs/ on
# main with every push, and npm ci catches a lock file that only fails on a clean
# clone. The full battery, tests included, runs on the release tag instead:
# release-check.yml next to this file.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ci, not install: it fails when package-lock.json and package.json have
      # drifted, which is exactly the failure that made a clean clone unbuildable.
      - run: npm ci

      - run: npm run check:push
