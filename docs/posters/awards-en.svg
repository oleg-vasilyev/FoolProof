<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="2462" viewBox="0 0 1620 2462"><rect x="0" y="0" width="1620" height="2462" fill="#1c1c1c"/><text x="60" y="146" fill="#9a9a9a" font-family="Noto Sans" font-size="30" letter-spacing="3">SESSION LOG</text><text x="60" y="286" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="126">AWARDS</text><text x="1560" y="146" fill="#f2f2f2" font-family="Noto Sans" font-size="52" text-anchor="end">6 Aug 2026</text><text x="1560" y="227" fill="#9a9a9a" font-family="Noto Sans" font-size="42" text-anchor="end">12 games · 5 players</text><line x1="60" y1="360" x2="1560" y2="360" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="360" width="8" height="216" fill="#e8c547"/><text x="108" y="420" fill="#6a6a6a" font-family="Noto Sans" font-size="26">01</text><text x="200" y="430" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">KING OF THE TABLE</text><text x="200" y="488" fill="#e8c547" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Oleg</text><text x="200" y="537" fill="#9a9a9a" font-family="Noto Sans" font-size="31">74% of the table below them over 12 games. Nobody sat higher.</text><line x1="60" y1="576" x2="1560" y2="576" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="576" width="8" height="216" fill="#e8c547"/><text x="108" y="636" fill="#6a6a6a" font-family="Noto Sans" font-size="26">02</text><text x="200" y="646" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">AHEAD ALL NIGHT</text><text x="200" y="704" fill="#e8c547" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Oleg</text><text x="200" y="753" fill="#9a9a9a" font-family="Noto Sans" font-size="31">In front on the chart, game after game, all 12 games.</text><line x1="60" y1="792" x2="1560" y2="792" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="792" width="8" height="216" fill="#9b7de0"/><text x="108" y="852" fill="#6a6a6a" font-family="Noto Sans" font-size="26">03</text><text x="200" y="862" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">TEFLON</text><text x="200" y="920" fill="#9b7de0" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Anya</text><text x="200" y="969" fill="#9a9a9a" font-family="Noto Sans" font-size="31">8 games in a row and never the fool — the night's longest.</text><line x1="60" y1="1008" x2="1560" y2="1008" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="1008" width="8" height="216" fill="#4fb3c4"/><text x="108" y="1068" fill="#6a6a6a" font-family="Noto Sans" font-size="26">04</text><text x="200" y="1078" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">THE CLIMB</text><text x="200" y="1136" fill="#4fb3c4" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Dima</text><text x="200" y="1185" fill="#9a9a9a" font-family="Noto Sans" font-size="31">A climb of 4 games — each one better than the one before.</text><line x1="60" y1="1224" x2="1560" y2="1224" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="1224" width="8" height="216" fill="#c8c8c8"/><text x="108" y="1284" fill="#6a6a6a" font-family="Noto Sans" font-size="26">05</text><text x="200" y="1294" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">THE TRUCE</text><text x="200" y="1352" fill="#c8c8c8" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Anya &amp; Roma</text><text x="200" y="1401" fill="#9a9a9a" font-family="Noto Sans" font-size="31">1 of 12 games that nobody lost.</text><line x1="60" y1="1440" x2="1560" y2="1440" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="1440" width="8" height="216" fill="#e8c547"/><text x="108" y="1500" fill="#6a6a6a" font-family="Noto Sans" font-size="26">06</text><text x="200" y="1510" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">THE PENDULUM</text><text x="200" y="1568" fill="#e8c547" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Oleg</text><text x="200" y="1617" fill="#9a9a9a" font-family="Noto Sans" font-size="31">7 games running, top half then bottom half, turn and turn about.</text><line x1="60" y1="1656" x2="1560" y2="1656" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="1656" width="8" height="216" fill="#4fb3c4"/><text x="108" y="1716" fill="#6a6a6a" font-family="Noto Sans" font-size="26">07</text><text x="200" y="1726" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">THE SLIDE</text><text x="200" y="1784" fill="#4fb3c4" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Dima</text><text x="200" y="1833" fill="#9a9a9a" font-family="Noto Sans" font-size="31">A slide of 4 games — each one falling short of the one before.</text><line x1="60" y1="1872" x2="1560" y2="1872" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="1872" width="8" height="216" fill="#e0a3c8"/><text x="108" y="1932" fill="#6a6a6a" font-family="Noto Sans" font-size="26">08</text><text x="200" y="1942" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="58" letter-spacing="2.2">FIRST BLOOD</text><text x="200" y="2000" fill="#e0a3c8" font-family="Noto Sans" font-weight="bold" font-size="42" letter-spacing="0.8">Veronika</text><text x="200" y="2049" fill="#9a9a9a" font-family="Noto Sans" font-size="31">Fool of the evening's first game.</text><line x1="60" y1="2088" x2="1560" y2="2088" stroke="#2e2e2e" stroke-width="1"/><rect x="60" y="2128" width="1500" height="264" fill="#c0392b"/><text x="86" y="2224" fill="#f7c9c2" font-family="Noto Sans" font-weight="bold" font-size="26" text-anchor="middle">09</text><path d="M2 21 L2 12 L0 2 L8 8 L13 0 L18 8 L26 2 L24 12 L24 21 Z" fill="#3a0e07" transform="translate(136 2179) scale(2)"/><text x="212" y="2223" fill="#1a1a1a" font-family="Noto Sans" font-weight="bold" font-size="74" letter-spacing="2.8">FOOL OF THE NIGHT</text><text x="136" y="2294" fill="#f2f2f2" font-family="Noto Sans" font-weight="bold" font-size="50" letter-spacing="0.8">Dima</text><text x="136" y="2337" fill="#f2f2f2" font-family="Noto Sans" font-size="31">Left the fool in 5 of 12 games — more often than anybody else.</text><rect x="0" y="2416" width="1620" height="46" fill="#2b2b2b"/><text x="810" y="2448" fill="#a8a8a8" font-family="Noto Sans" font-weight="bold" font-size="26" text-anchor="middle">@FoolProofMegaBot</text></svg>